    pac.test.appstudio.openshift.io/sha-title: |-
      fix: address security audit findings (FIND-008, FIND-009, FIND-011, FIND-014) (#459)

      * fix: address security audit findings (FIND-008, FIND-009, FIND-011, FIND-014)

      FIND-008: Add seccompProfile RuntimeDefault to controller container
      FIND-009: Switch runtime image from ubi9/ubi to ubi9/ubi-minimal to reduce attack surface
      FIND-011: Fix renovate baseBranchPatterns regex to cover backplane-5.x branches
      FIND-014: Add Pod Security Admission labels (enforce: restricted) to operator namespace

      Co-Authored-By: Claude Opus 4.6 <noreply@anthropic.com>

      * fix: add pod-level seccompProfile as PSA restricted default

      Ensures any future init container or webhook-injected sidecar
      inherits a compliant seccomp profile without needing its own.

      Co-Authored-By: Claude Opus 4.6 <noreply@anthropic.com>

