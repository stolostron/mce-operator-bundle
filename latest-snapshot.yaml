    pac.test.appstudio.openshift.io/sha-title: |-
      [release-2.14] ACM-39080 ACM-39091 glasswing: fix f001 — derive Ansible host/token from RBAC-checked Secret [release-2.15] (#6702)

      * glasswing: fix f001 — derive Ansible host/token from RBAC-checked Secret

      POST /ansibletower previously trusted body-supplied {towerHost, token},
      validating only the URL pathname against an allowlist before issuing an
      HTTPS GET to the body-supplied hostname and piping the full response back to
      the caller. Any authenticated hub user (no RBAC required) could pivot the
      console pod to arbitrary internal/external hosts and read the response.

      The handler now accepts only {secretNamespace, secretName, ansiblePath} and
      reads the referenced credential Secret with the caller's bearer token, so
      kube-apiserver enforces RBAC. The tower host and token are derived
      exclusively from that Secret; body-supplied hosts are rejected with 400.
      Frontend listAnsibleTowerJobs/Inventories and their callers are updated to
      pass the credential Secret reference instead of decoded host/token.

      Addresses: analysis-results/findings/mce/console/console-triage.json#f001
      CWEs: CWE-918

      ------

      Amended with adjustments:
      - Fix chucks.join() -> chucks.join('')

      Signed-off-by: Kevin Cormier <kcormier@redhat.com>

      * Address CodeRabbit feedback and add testing Generated-by: Claude Opus 4.8

      Signed-off-by: Kevin Cormier <kcormier@redhat.com>

