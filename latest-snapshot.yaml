    pac.test.appstudio.openshift.io/sha-title: |-
      Fix hypershift stage copy for the OpenShift Go builder

      ART replaces the go-toolset parent with openshift/golang-builder, which
      has no user named default. COPY --chown=default then fails the image
      build. Build that stage as root so the copy and make succeed on both
      parents.

