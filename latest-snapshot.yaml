    pac.test.appstudio.openshift.io/sha-title: |-
      ACM-44685: Don't panic when ClusterVersion availableUpdates is null (#627)

      * ACM-44685: Don't panic when ClusterVersion availableUpdates is null

      Disconnected clusters leave availableUpdates as JSON null. The force
      upgrade path treated that as a slice and crashed the curator job
      before it could fall back to the image tag.

      Signed-off-by: Trushna Deokar <tdeokar@redhat.com>
      Co-authored-by: Cursor <cursoragent@cursor.com>

