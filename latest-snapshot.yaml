    pac.test.appstudio.openshift.io/sha-title: |-
      fix: quote COMPONENT/CONFIG in Makefile.dev recipes (#3839)

      * fix: quote COMPONENT/CONFIG in Makefile.dev recipes

      Same fix as stolostron/multiclusterhub-operator#4583 - a COMPONENT
      input was added to the regenerate workflows here too, passing it as
      `make regenerate-charts COMPONENT="${COMPONENT}"`. When COMPONENT is
      empty (every scheduled run, and any manual run that doesn't specify
      one), this sets Make's $(COMPONENT) to a genuinely empty string via
      command-line assignment, which overrides the `?= ""` default.

      The recipes interpolate this unquoted (`--component $(COMPONENT)`), so
      a genuinely empty value produces no token at all on the command line,
      not even empty quotes - the previous "" default only worked by
      accident because its value literally contained two quote characters
      that the shell interpreted as an empty argument. With nothing between
      --component and the next flag, argparse sees "--component" followed
      immediately by "--config" and raises "expected one argument", since
      the next token looks like another flag rather than a value.

      Quote all $(COMPONENT)/$(CONFIG) references in the recipes and drop
      the embedded-quote-character defaults (now redundant and would produce
      a `""""` artifact once the recipes quote correctly), so an empty value
      always yields a well-formed, empty-but-present argument regardless of
      how it was set.

      Verified with `make -n`: COMPONENT="" and no override both now produce
      a well-formed `--component "" --config ""` instead of a bare
      `--component` with nothing following it.

      Signed-off-by: dislbenn <dbennett@redhat.com>

      * fix: preserve COMPONENT/CONFIG as single argv entries

      Same fix as stolostron/multiclusterhub-operator#4583 (found there by
      CodeRabbit). execute_script() built the subprocess command via
      `args.split()` on a plain concatenated string, which mis-tokenizes any
      COMPONENT/CONFIG value containing whitespace (e.g. a config path like
      "path with spaces/config.yaml") into multiple separate argv entries
      instead of one. This also affected the extra_args passthrough here,
      which was joined into the same string with " ".join() and then
      subject to the same re-split.

      Switch prepare_and_execute()/execute_script() to build and pass an
      actual list from the start instead of round-tripping through a joined
      string. The static "args" templates in SUPPORTED_OPERATIONS are
      developer-authored strings, so they're tokenized once with shlex
      (quote-aware); COMPONENT/CONFIG and extra_args are then appended as
      individual list elements, so there's no later re-split that could
      break a whitespace-containing value apart.

      Signed-off-by: dislbenn <dbennett@redhat.com>

      ---------

      Signed-off-by: dislbenn <dbennett@redhat.com>
