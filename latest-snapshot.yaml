    pac.test.appstudio.openshift.io/sha-title: |-
      ACM-23889 Resolve remaining lower-severity Sonar reliability issues (#7005)

      * ACM-23889 Simplify negated-equality check in HypershiftUpgradeModal

      `!controlPlaneChecked === false` is a confusing negated expression in an
      equality check (Sonar typescript:S7736). It is equivalent to the plain
      boolean `controlPlaneChecked`; simplify accordingly. No behavior change.

      Signed-off-by: Kevin Cormier <kcormier@redhat.com>
      Co-Authored-By: Claude Opus 4.8 <noreply@anthropic.com>

      * ACM-23889 Remove side effect from waitFor callback in Searchbar test

      Sonar typescript:S8985 flags the fireEvent.click side effect inside the
      waitFor callback, which can run multiple times. The menu item is already
      asserted present, so click it directly instead of inside waitFor.

      Signed-off-by: Kevin Cormier <kcormier@redhat.com>
      Co-Authored-By: Claude Opus 4.8 <noreply@anthropic.com>

      * ACM-23889 Mark floating promises as ignored in multicluster-sdk

      Sonar typescript:S9383 flags promise-returning calls used as statements
      without being awaited or handled. These are intentional fire-and-forget
      calls (watch/search startup and refetch); prefix them with the `void` operator to make the intent
      explicit, matching existing usage in the codebase. No behavior change.

      Signed-off-by: Kevin Cormier <kcormier@redhat.com>
      Co-Authored-By: Claude Opus 4.8 <noreply@anthropic.com>

      * ACM-23889 Mark floating promises as ignored in Search routes

      Sonar typescript:S9383 flags promise-returning calls used as statements
      without being awaited or handled. These are intentional fire-and-forget
      calls (navigation and search queries); prefix them with the `void` operator to make the intent
      explicit, matching existing usage in the codebase. No behavior change.

      Signed-off-by: Kevin Cormier <kcormier@redhat.com>
      Co-Authored-By: Claude Opus 4.8 <noreply@anthropic.com>

      * ACM-23889 Mark floating promises as ignored in Infrastructure routes

      Sonar typescript:S9383 flags promise-returning calls used as statements
      without being awaited or handled. These are intentional fire-and-forget
      calls (navigation and resource create/fetch); prefix them with the `void` operator to make the intent
      explicit, matching existing usage in the codebase. No behavior change.

      Signed-off-by: Kevin Cormier <kcormier@redhat.com>
      Co-Authored-By: Claude Opus 4.8 <noreply@anthropic.com>

      * ACM-23889 Mark floating promises as ignored in Applications routes

      Sonar typescript:S9383 flags promise-returning calls used as statements
      without being awaited or handled. These are intentional fire-and-forget
