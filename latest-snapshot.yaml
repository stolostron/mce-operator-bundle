    pac.test.appstudio.openshift.io/sha-title: |-
      Add poddisruptionbudgets RBAC to hypershift-addon agent ClusterRole (#804)

      The hypershift operator install now creates a PodDisruptionBudget for the
      operator Deployment (openshift/hypershift, OCPBUGS-114936). The addon agent
      runs the install as ServiceAccount hypershift-addon-agent-sa, whose
      ClusterRole did not permit managing poddisruptionbudgets, so the install
      Job failed with a forbidden error when applying the PDB and the operator
      PDB was never created.

      Grant policy/poddisruptionbudgets (get/list/watch/create/update/patch/
      delete) in the agent ClusterRole template so the install Job can apply the
      PDB, and add a unit test asserting the permission is present.

      Refs: OCPBUGS-114936

      Signed-off-by: Dhruv Gautam <dgautam@redhat.com>
