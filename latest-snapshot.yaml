    pac.test.appstudio.openshift.io/sha-title: |-
      ACM-40205: Remove Maestro and CloudEventsConductor components (#3963)

      Maestro was force-disabled in MCE 5.0. This removes it entirely from
      MCE 5.1 along with the related CloudEventsConductor gRPC server
      support for ClusterManager, since both are no longer used.

      - Remove MaestroPreview constant, component list entries, and
        deprecation validation in api/v1
      - Remove ensureMaestro/ensureNoMaestro/ensureMaestroDatabaseSecret and
        the ClusterManager gRPC server (CloudEventsConductor) functions from
        controllers/toggle_components.go
      - Remove maestro namespace cleanup, chart directory mapping, and
        toggle reconciliation block from backplaneconfig_controller.go
      - Delete the maestro Helm chart (pkg/templates/charts/toggle/maestro)
        and its chart dir constant in pkg/toggle
      - Remove maestro/cloudevents_conductor test image entries in
        pkg/utils/utils.go and update the expected test image count
      - Remove associated unit tests and unused test helpers
      - Update ARCHITECTURE.md component list

      Signed-off-by: dislbenn <dbennett@redhat.com>
