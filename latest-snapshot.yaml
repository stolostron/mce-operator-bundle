      * fix(deps): update vulnerable tools modules on release-1.26

      Update golang.org/x/mod, x/net, and x/text to versions that clear the Trivy findings in the tools module. Refresh related module checksums.

      Assisted-by: Codex GPT-6 <noreply@anthropic.com>

      * chore: update release-1.26 Go toolchain to 1.26.10

      Use the Go patch release that fixes GO-2026-6809 in crypto/x509.

      Assisted-by: Codex GPT-6 <noreply@anthropic.com>

      * fix(exp): ignore NotFound when deleting an already-absent owner Machine

      The AzureMachinePoolMachine reconciler deletes the owner CAPI Machine once
      the scale set VM reports the Deleting provisioning state. If that Machine
      was already deleted by an earlier reconcile attempt or by another
      controller while the stale object is still present in the cache, the Delete
      call returns NotFound and reconciliation fails even though the cleanup has
      already completed.

      Treat a missing owner Machine as success on this path, matching the
      NotFound handling the same reconciler already applies when it looks the
      owner Machine up earlier in the reconcile. Other delete errors are still
      returned.

      Signed-off-by: Shashank Varma <324153016+shashankvarma499@users.noreply.github.com>

