    pac.test.appstudio.openshift.io/sha: 28e6280cc286cbb7388dd5932706e1efec900a13
    pac.test.appstudio.openshift.io/sha-title: |-
      Feature/cluster manager np (#3787)

      * Enable OCM hub NetworkPolicies and add cluster-manager operator NP
      Wire MCE networkPolicies.enabled to the ClusterManager NetworkPolicies
      feature gate so registration-operator applies hub NPs, and add a chart
      NetworkPolicy for the registration-operator Deployment itself.

      Signed-off-by: Aman Gupta <amangta.gupta@gmail.com>

      * fix: preserve registrationConfiguration.featureGates in gRPC server lifecycle

        enableClusterManagerGRPCServer was replacing the entire registrationConfiguration
        with only registrationDrivers, and disableClusterManagerGRPCServer was deleting the
        entire key. Both now surgically modify only registrationDrivers, preserving
        featureGates (e.g. NetworkPolicies) set by other reconcile paths.

      Signed-off-by: Aman Gupta <amangta.gupta@gmail.com>

      * style: wrap long lines in ClusterManager gRPC featureGates tests
      Keep toggle_components_test.go under the 120-character limit while
      preserving NetworkPolicies featureGates assertions.

      Signed-off-by: Aman Gupta <amangta.gupta@gmail.com>

      ---------

      Signed-off-by: Aman Gupta <amangta.gupta@gmail.com>
