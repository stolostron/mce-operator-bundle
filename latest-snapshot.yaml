    pac.test.appstudio.openshift.io/sha: 95207c6f3cce1b1ad626bcf2918300bbbc1a5bfe
    pac.test.appstudio.openshift.io/sha-title: |-
      Apply ExtraObjects on HCP proxy create before HostedCluster (#791)

      * feat: apply ExtraObjects on HCP proxy create before HostedCluster

      Agent platform Roles and additional-trust-bundle ConfigMaps were dropped
      on create. Accept extraObjects, stamp proxy labels, and fail the request
      if spoke apply is denied.

      Signed-off-by: yiraeChristineKim <yikim@redhat.com>
      Co-authored-by: Cursor <cursoragent@cursor.com>

      * test: cover ExtraObjects Role and ConfigMap in HCP proxy e2e

      Signed-off-by: yiraeChristineKim <yikim@redhat.com>
      Co-authored-by: Cursor <cursoragent@cursor.com>

      * fix: bind global ClusterSet so cluster-proxy addon is not deleted

      The chart Placement only selects clusters after a ManagedClusterSetBinding
      exists in the release namespace. Without it, addon-manager removes the
      ManagedClusterAddOn before kubectl wait, which then fails with NotFound.

      Signed-off-by: yiraeChristineKim <yikim@redhat.com>
      Co-authored-by: Cursor <cursoragent@cursor.com>

      * fix: handle HCP proxy encode errors for gosec G104

      Sonar security rating on new code failed on unhandled Encode/Write
      errors. Check those returns and wrap the long ExtraObjects test line.

      Signed-off-by: yiraeChristineKim <yikim@redhat.com>
      Co-authored-by: Cursor <cursoragent@cursor.com>

      * fix: address HCP proxy PR review for extraObjects handling

      Use discovery-backed REST mapping, bound create payloads, match dedicated
      GVKs exactly, sanitize spoke error messages, and derive cluster-proxy poll
      timeouts from CLUSTER_PROXY_TIMEOUT.

      Co-authored-by: Cursor <cursoragent@cursor.com>

      * fix: complete CodeRabbit review feedback for HCP proxy PR

      Use p.writeJSONError for extra-object failures, wrap JSON encode/write
      errors in logs, add docstrings, and improve test cleanup and assertion
      messages in unit and e2e extraObjects coverage.

      Co-authored-by: Cursor <cursoragent@cursor.com>

      * fix: sanitize spoke error logs and tighten cluster-proxy install polling

      Parse CLUSTER_PROXY_TIMEOUT with unit suffixes, apply kubectl request timeouts
      during polls, and avoid logging untrusted spoke Status.Message text. E2e create
      payloads use valid None-platform services; add log-sanitization unit coverage.

      Co-authored-by: Cursor <cursoragent@cursor.com>

      * test: fail mock handler writes in extra-object denied test

      Check io.WriteString errors in the spoke mock so incomplete responses
      cannot mask test failures.

      Co-authored-by: Cursor <cursoragent@cursor.com>

      * fix: install cluster-proxy addon with Manual strategy in e2e

      Placement stays NoManagedClusterMatched on kind, so addon-manager never
      creates the ManagedClusterAddOn. Switch the CMA to Manual, apply the MCA
      ourselves, and re-apply until Available.

      Signed-off-by: yiraeChristineKim <yikim@redhat.com>
      Co-authored-by: Cursor <cursoragent@cursor.com>

      * fix: restore etcd.managementType in HCP proxy e2e create payloads

      The services-array update dropped spec.etcd.managementType, causing the
      proxy to POST an invalid empty managementType and fail spoke validation.

      Co-authored-by: Cursor <cursoragent@cursor.com>

      * fix: add default case to cluster-proxy timeout unit switch

      Handle unexpected unit values explicitly in parse_timeout_seconds.

      Co-authored-by: Cursor <cursoragent@cursor.com>

      * feat: rollback extraObjects on create failure and echo in response

      Roll back extra objects created in the same request when a later
      extra object or HostedCluster create fails. Include applied extraObjects
      in the create ResourceBundle response.

      Co-authored-by: Cursor <cursoragent@cursor.com>

      ---------

      Signed-off-by: yiraeChristineKim <yikim@redhat.com>
      Co-authored-by: Cursor <cursoragent@cursor.com>
