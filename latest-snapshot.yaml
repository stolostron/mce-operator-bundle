    pac.test.appstudio.openshift.io/sha-title: |-
      docs: fix branch-sync-policy drift (ARO-29174) (#514)

      * docs: fix branch-sync-policy drift (ARO-29174)

      Correct three stale items in docs/branch-sync-policy.md after verifying
      every ARO-29174 acceptance criterion against the live repo:

      - Fix the release-2.18 -> backplane-5.0 FFWD reference: the workflow is
        ffwd-branch.yaml on the release-2.18 branch, not ffwd-release-2.18.yaml
        (the old relative link was broken).
      - Correct the mce-50 Tekton audit: mce-50 maps to backplane-5.0 (fed from
        release-2.18), so its pull-request pipeline lives on release-2.18 (added
        by merged PR #472), not on main. PR #471 was closed unmerged.
      - Document backplane-5.2: main now fast-forwards into both backplane-5.1 and
        backplane-5.2; add it to the mapping and ruleset tables and note that the
        backplane-branches-lockdown ruleset does not yet include it.

      Assisted-by: Claude Opus 4.8 <noreply@anthropic.com>

      * docs: mark backplane-5.2 ruleset gap resolved

      backplane-5.2 was added to the backplane-branches-lockdown ruleset
      (refs/heads/backplane-5.2), so it now has the same non-fast-forward and
      deletion protection as backplane-5.0/5.1. Update the note accordingly.

      Assisted-by: Claude Opus 4.8 <noreply@anthropic.com>

      * docs: correct PR #472 attribution for mce-50 pipeline

      Self-review finding addressed before external review. PR #472 did not add the mce-50 pull-request pipeline on release-2.18; the file already existed. PR #472 modified its cel expression to trigger on release-2.18 pull requests (swapping the prior main target).

      Assisted-by: Claude Opus 4.8 <noreply@anthropic.com>
