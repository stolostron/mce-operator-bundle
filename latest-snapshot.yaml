    pac.test.appstudio.openshift.io/sha-title: |-
      fix(security): validate SQL identifiers in list queries (#104)

      * fix(security): validate SQL identifiers in list queries

      Validate search identifiers against model schemas and use structured GORM ordering. Add handler/unit and Kind E2E regression coverage, and document the query restrictions.

      Jira: ARO-28292
      Co-authored with Red Hat Agentic SDLC AI Agents

      Signed-off-by: Joshua Packer <jpacker@redhat.com>
      (cherry picked from commit 1e051ac2e442f9cbbbe0ec7112bba6dda648f6ef)

      * fix(deps): upgrade ocm-common for JSONB safety

      Use the parser version that binds JSONB path keys instead of interpolating them into SQL. This is required for the SQL identifier fix to pass its regression tests on the backplane branch.

      Signed-off-by: Joshua Packer <jpacker@redhat.com>

      * fix(ci): use patched Go 1.26.11 in lint workflow

      Go 1.26.10 is affected by GO-2026-6859 in net/http. Use Go 1.26.11 so govulncheck runs with the fixed standard library.

      Signed-off-by: Joshua Packer <jpacker@redhat.com>

      * fix(security): redact list errors and structure joins

      Avoid logging user-provided search and order identifiers in validation errors. Build related joins and grouping from structured GORM identifiers, and add log, DAO, and end-to-end regression coverage for rejected and valid list queries.

      Assisted-by: OpenCode (GLM 5.3)
      Signed-off-by: Joshua Packer <jpacker@redhat.com>
      (cherry picked from commit a515dc9d53b21cf2ff9736d6c12d26bb7f2be2f3)

      * fix(security): render joins in FROM and correct list e2e coverage

      The structured join was passed to GORM as a WHERE expression, producing invalid SQL; route it through the FROM clause and accumulate repeated joins. Key the resource-bundle e2e assertions on the created resource ids, since a resource defaults its name to its id rather than the work name, and assert on the rejected identifier itself in the log regression test so a leaked identifier fails the test.

      Assisted-by: OpenCode (GLM 5.3)
      Signed-off-by: Joshua Packer <jpacker@redhat.com>
      (cherry picked from commit e9032c17c58b59d0e3f4400b76f06246446e5792)

      * test(dao): qualify joined name filter

      The join regression test joins resources and consumers, both of which have a name column. Qualify the filter as resources.name so the dry-run query matches valid PostgreSQL and the test verifies the intended query placement.

      Assisted-by: OpenCode (GLM 5.3)
      Signed-off-by: Joshua Packer <jpacker@redhat.com>
      (cherry picked from commit e53519f6c68473c19c06d1404ac575501e2cb17b)

      * test(e2e): use supported JSON search syntax

      The SQL parser rejects a direct labels ->> expression on consumers. Keep consumer name search and ordering coverage, and limit the JSONB label case to the resource payload query supported by the parser.

      Assisted-by: OpenCode (GLM 5.3)
      Signed-off-by: Joshua Packer <jpacker@redhat.com>
      (cherry picked from commit 251c33600e88bfd5b67997be2c3f06cf378f030c)

      * fix(search): reject JSON operators on scalar columns

      Validate the base column of each JSON operator against the GORM model's JSON type before building the query. This prevents scalar fields such as resource names from reaching PostgreSQL as JSON expressions and returning a 500, while preserving mixed scalar and JSON searches.

      Assisted-by: OpenCode (GLM 5.3)
      Signed-off-by: Joshua Packer <jpacker@redhat.com>
      (cherry picked from commit bf8925ce9e197b8479385b7d2ad3372083c4e4ec)

      * docs: clarify JSON search validation comments

      Document that JSON type validation follows GORM model metadata, explain JSON parser selection and base-column scanning, and describe the persisted JSONB consumer-label field.

      Assisted-by: OpenCode (GLM 5.3)
      Signed-off-by: Joshua Packer <jpacker@redhat.com>
      (cherry picked from commit dc17e2a7491236c0eb4b8aa6d20b9e6a1a99cda9)

      ---------

      Signed-off-by: Joshua Packer <jpacker@redhat.com>
