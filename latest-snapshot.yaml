    pac.test.appstudio.openshift.io/sha: 37257f857d4b5fe46c1cb419b98246306d77ccfa
    pac.test.appstudio.openshift.io/sha-title: |-
      fix(deps): resolve CVEs in Go standard library (#75)

      Bump the Go toolchain to 1.26.6 to resolve stdlib vulnerabilities:
      - GO-2026-6218 (net/url quadratic complexity)
      - GO-2026-6091 (html/template JS regexp context tracking)
      - GO-2026-6090 (crypto/tls post-handshake message limit)
      - GO-2026-6089 (net/http ReadHeaderTimeout on unencrypted HTTP/2 check)
      - GO-2026-6088 (encoding/xml recursion depth guard)
      - GO-2026-5972 (encoding/asn1 recursion depth guard)
      - GO-2026-5026 (golang.org/x/net/idna ASCII-only punycode labels, via net/http)

      govulncheck confirms all 7 reachable stdlib vulnerabilities are resolved.

      Note: GO-2026-5932 (golang.org/x/crypto/openpgp, unmaintained package) remains
      as an indirect, unreachable dependency with no fix available upstream (N/A).
      It is not imported by any of our code and not present in the call graph.

      - Build, lint (no new issues), and unit tests pass

      Signed-off-by: swarm-cve-agent <swarm-cve-agent@noreply.local>
      Co-authored-by: swarm-cve-agent <swarm-cve-agent@noreply.local>
