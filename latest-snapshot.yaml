      * Update test metadata and versions for CAPZ v1.28.0

      Signed-off-by: William Yao <william2000yao@gmail.com>

      * Publish Failed vmState when reapply of a Failed VM fails non-transiently

      When an existing VM is in the Failed provisioning state, CAPZ attempts
      recovery via Reapply before publishing status. If Reapply itself fails
      (e.g. Azure reports an OS provisioning failure as terminal and
      non-recoverable), the Failed state read from Azure was never copied to
      AzureMachine.status.vmState, because the state is only published on the
      successful-result path. Tooling that relies on vmState == Failed to
      replace machines (as it could before v1.28) then never sees the failure
      and the cluster can be stuck retrying Reapply indefinitely.

      Publish vmState = Failed when the VM was observed Failed and the reapply
      attempt fails with a non-transient error, while still returning that
      error. In-progress reapply operations and transient failures (throttling,
      retryable server errors, timeouts) are not published, so CAPZ keeps the
      chance to recover the VM before remediation consumers replace it. A
      successful reapply continues to update the state from the refreshed VM.

