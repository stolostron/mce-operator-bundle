    pac.test.appstudio.openshift.io/sha-title: |-
      ACM-47694 AppSet Topology: Progressing alert ends too quickly (#6934)

      * ACM-47694 keep AppSet Progressing overlay until deploy settles

      Hold the Progressing alert while clusters are still missing resources
      within the apps grace window, and while sync status is Progressing-only.
      Phase-lock danger-node pulse animations to wall-clock so topology
      refresh remounts do not restart the pulse from t=0.

      Signed-off-by: John Swanke <jswanke@redhat.com>
      Co-authored-by: Cursor <cursoragent@cursor.com>

      * ACM-47694 add regression tests for Progressing overlay and pulse phase-lock

      Signed-off-by: John Swanke <jswanke@redhat.com>
      Co-authored-by: Cursor <cursoragent@cursor.com>

      * ACM-47694 stop error pulse flashing on topology refresh

      Preserve red pulses across the pre-analysis paint, sync status via
      setData instead of rebuilding the model on pulse changes, overlay the
      pulse on the existing node shape, and sticky-keep danger pulse across
      transient missing status.

      Signed-off-by: John Swanke <jswanke@redhat.com>
      Co-authored-by: Cursor <cursoragent@cursor.com>

      * ACM-47694 update tests for non-flashing error pulse

      Signed-off-by: John Swanke <jswanke@redhat.com>
      Co-authored-by: Cursor <cursoragent@cursor.com>

      * ACM-47694 defer topology refresh paint until analysis settles

      Remove the forced-red pulse hack. On refresh, keep showing the current
      diagram until analysis completes so error pulses are not dropped by an
      intermediate pre-analysis status paint.

      Signed-off-by: John Swanke <jswanke@redhat.com>
      Co-authored-by: Cursor <cursoragent@cursor.com>

      * ACM-47694 apply prettier formatting to health tests

      Signed-off-by: John Swanke <jswanke@redhat.com>
      Co-authored-by: Cursor <cursoragent@cursor.com>

      ---------

      Signed-off-by: John Swanke <jswanke@redhat.com>
      Co-authored-by: Cursor <cursoragent@cursor.com>
