    pac.test.appstudio.openshift.io/sha-title: |-
      feat: use CSR-only admin credential request, drop legacy fallback (#515) (#530)

      The admin-credential export previously tried the CSR-based
      2026-09-01-preview API and, on any error starting that request, fell
      back to the legacy no-CSR 2026-06-30-preview API. Now that the CSR-based
      path is the supported one, remove the fallback: request admin
      credentials solely via the CSR flow and return any error directly.

      Delete the now-unused requestAdminCredentialLegacy helper and drop the
      v20260630preview SDK dependency, which is no longer referenced. The CSR
      key and CSR generation, bounded poll, empty-kubeconfig guard, and
      client-side private-key injection are unchanged.

      Signed-off-by: Chai Bot <ship-help-github@redhat.com>
