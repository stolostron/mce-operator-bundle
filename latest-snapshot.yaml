    pac.test.appstudio.openshift.io/sha: 27b13aa0be452e1b49d1e1efdaa5ed8f54e18d3d
    pac.test.appstudio.openshift.io/sha-title: |-
      ACM-45848 Go Backend: Post-Mirroring Code Adjustments (#6953)

      * ACM-45848: key ApplicationSet child maps by namespace/name

      Two ApplicationSets with the same name in different namespaces were sharing child Applications because the maps were keyed by name only.

      Signed-off-by: Enrique Mingorance Cano <emingora@redhat.com>
      Co-authored-by: Cursor <cursoragent@cursor.com>

      * ACM-45848: hold aggregate mutex across push-model query inputs

      addPushModelPodQueryInputs writes the shared list cache while a rebuild can hold the engine lock, which races into a fatal concurrent map write.

      Signed-off-by: Enrique Mingorance Cano <emingora@redhat.com>
      Co-authored-by: Cursor <cursoragent@cursor.com>

      * ACM-45848: include API group and resource in SSE SSAR cache keys

      Kinds that share a name across API groups, such as ACM and OLM Subscription, were reusing one SelfSubjectAccessReview decision.

      Signed-off-by: Enrique Mingorance Cano <emingora@redhat.com>
      Co-authored-by: Cursor <cursoragent@cursor.com>

      * ACM-45848: allowlist Ansible Tower response headers

      Forwarding every Tower header, including Set-Cookie, let the upstream set cookies on the console origin.

      Signed-off-by: Enrique Mingorance Cano <emingora@redhat.com>
      Co-authored-by: Cursor <cursoragent@cursor.com>

      * ACM-45848: refuse Ansible Tower client redirects

      A 302 from Tower was followed by the proxy client, so the request could leave the allowlisted path and host.

      Signed-off-by: Enrique Mingorance Cano <emingora@redhat.com>
      Co-authored-by: Cursor <cursoragent@cursor.com>

      * ACM-45848: cache successful MCH namespace for Search discovery

      Search endpoint resolution listed MulticlusterHub on every request when SEARCH_API_URL was empty. Errors and empty lists stay uncached so a later request can retry.

      Signed-off-by: Enrique Mingorance Cano <emingora@redhat.com>
      Co-authored-by: Cursor <cursoragent@cursor.com>

      * strip only the exact /multicloud prefix

      A bare HasPrefix match rewrote paths like /multicloudfoo, which is not a multicloud route.

      Signed-off-by: Enrique Mingorance Cano <emingora@redhat.com>
      Co-authored-by: Cursor <cursoragent@cursor.com>

      * clamp aggregate pages and RBAC slice capacity

      A page below 1 produced a negative start index, and stop before start could panic on make capacity.

      Signed-off-by: Enrique Mingorance Cano <emingora@redhat.com>
      Co-authored-by: Cursor <cursoragent@cursor.com>

      * treat zero pod availability as danger

      Falling back to current before the progress check marked missing pods as in-progress instead of danger.

      Signed-off-by: Enrique Mingorance Cano <emingora@redhat.com>
      Co-authored-by: Cursor <cursoragent@cursor.com>

      * return 400 for unknown VM actions

      Unknown or malformed VM actions were answered with 404, and GET error paths wrote an empty body instead of JSON null.

      Signed-off-by: Enrique Mingorance Cano <emingora@redhat.com>
      Co-authored-by: Cursor <cursoragent@cursor.com>

      * reject empty vm-actor tokens and a nil REST config

      An empty vm-actor Secret token was treated as usable, and a nil RESTConfig panicked in userKube.

      Signed-off-by: Enrique Mingorance Cano <emingora@redhat.com>
      Co-authored-by: Cursor <cursoragent@cursor.com>

      * check the SSE parity scanner error

      A truncated or oversized SSE body could fail the scan with no test failure.

      Signed-off-by: Enrique Mingorance Cano <emingora@redhat.com>
      Co-authored-by: Cursor <cursoragent@cursor.com>

      * return 405 for non-POST Search proxy requests

      A plain GET that is not a WebSocket upgrade is not a missing route; it is the wrong method.

      Signed-off-by: Enrique Mingorance Cano <emingora@redhat.com>
      Co-authored-by: Cursor <cursoragent@cursor.com>

      * omit the port from the OAuth cookie domain

      Cookie Domain with a port is invalid and prevents clearing the oauth_proxy cookie on logout.

      Signed-off-by: Enrique Mingorance Cano <emingora@redhat.com>
      Co-authored-by: Cursor <cursoragent@cursor.com>

      * unlock cluster-proxy namespace lookup during fetch

      Holding the mutex across the MultiClusterEngine list blocked other callers for the duration of the API call.

      Signed-off-by: Enrique Mingorance Cano <emingora@redhat.com>
      Co-authored-by: Cursor <cursoragent@cursor.com>

      * require a 12-digit AWS account id

      Unvalidated aws_account_id values were interpolated into OCM search queries and account role requests.

      Signed-off-by: Enrique Mingorance Cano <emingora@redhat.com>
      Co-authored-by: Cursor <cursoragent@cursor.com>

      * hash the RBAC event SSAR cache token

      Storing the raw bearer token in the SSAR cache key kept credentials in process memory longer than needed.

      Signed-off-by: Enrique Mingorance Cano <emingora@redhat.com>
      Co-authored-by: Cursor <cursoragent@cursor.com>

      * lint Go files per directory

      golangci-lint rejects a single run that names files from more than one directory, which broke lint-staged on multi-package Go changes.

      Signed-off-by: Enrique Mingorance Cano <emingora@redhat.com>
      Co-authored-by: Cursor <cursoragent@cursor.com>

      * skip caching hub flags after a failed lookup

      A temporary MultiClusterGlobalHub CRD or hub list error was cached as a negative result until the TTL expired.

      Signed-off-by: Enrique Mingorance Cano <emingora@redhat.com>
      Co-authored-by: Cursor <cursoragent@cursor.com>

      ---------

      Signed-off-by: Enrique Mingorance Cano <emingora@redhat.com>
      Co-authored-by: Cursor <cursoragent@cursor.com>
