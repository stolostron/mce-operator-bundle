    pac.test.appstudio.openshift.io/sha: 4cd1a340254cd7121fd00e12b6b053a5d0077ece
    pac.test.appstudio.openshift.io/sha-title: |-
      ACM-41796 Update/Remove automation template actions do not work for Hosted Control Plane clusters (#6765)

      * fix(clusters): resolve automation namespace/secret for HCP clusters

      Update and Remove automation template actions assumed a Hive-style
      layout where the ClusterCurator/Secret namespace equals cluster.name.
      Hosted Control Plane clusters share a hosted namespace, so those
      actions silently failed to find or delete the right resources.

      Add automationCuratorNamespace/automationSecretName helpers and use
      them in UpdateAutomationModal and RemoveAutomationModal to resolve the
      correct namespace and the ACM-39253 differentiated Secret name.

      Signed-off-by: John Swanke <jswanke@redhat.com>
      Co-authored-by: Cursor <cursoragent@cursor.com>

      * test(clusters): add regression tests for HCP automation template actions

      Cover automationCuratorNamespace/automationSecretName directly, and
      add/adjust Update and Remove automation template tests so a Hosted
      Control Plane cluster with a shared namespace and differentiated
      Secret name is exercised end to end. Also update the
      UpdateAutomationTemplate support test fixture now that
      hasAutomationTemplate is a required condition.

      Signed-off-by: John Swanke <jswanke@redhat.com>
      Co-authored-by: Cursor <cursoragent@cursor.com>
      Signed-off-by: John Swanke <jswanke@redhat.com>

      * add some comments

      Signed-off-by: John Swanke <jswanke@redhat.com>

      ---------

      Signed-off-by: John Swanke <jswanke@redhat.com>
      Co-authored-by: Cursor <cursoragent@cursor.com>
