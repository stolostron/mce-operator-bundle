    pac.test.appstudio.openshift.io/sha-title: |-
      ACM-39226: Add HCP proxy finalizers PATCH endpoint for from-hub delete (#793)

      * feat: add HCP proxy finalizers PATCH for from-hub delete

      Expose PATCH .../hostedclusters/{name}/finalizers to add or remove the
      CLI destroy finalizer on the hosting cluster via merge patch, with
      conflict retries and clear error responses for from-hub delete.

      Includes discovery test updates, CodeRabbit review fixes, HTTP 409
      StatusReasonConflict mapping, Sonar deduplication and safe int32
      conversion, and e2e CI fix waiting for the OCM addon webhook before
      cluster-proxy install.

      Co-authored-by: Cursor <cursoragent@cursor.com>

      * fix: dedupe method-not-allowed message and wrap long test lines

      Address remaining Sonar findings for duplicated string literals and
      lines exceeding the 120-character limit in statusReasonForCode tests.

      Co-authored-by: Cursor <cursoragent@cursor.com>

      * ci: add make lint for 120-char line length checks

      Add golangci-lint (lll) via make lint/make lint-all, a GitHub Actions
      workflow, and wrap long lines in changed files so new code matches Sonar.

      Co-authored-by: Cursor <cursoragent@cursor.com>

      ---------

      Co-authored-by: Cursor <cursoragent@cursor.com>
