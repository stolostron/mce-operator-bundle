    pac.test.appstudio.openshift.io/sha-title: |-
      ACM-49557 PolicyReports: switch Overview/Insights from policyreportState to getResource/listResources (#7035)

      * feat(overview): load PolicyReports via getResource/listResources

      Stop Overview/Insights and StatusSummaryCount from reading SSE-backed
      policyreportState. Fetch on demand with React Query (5m staleTime) so
      Insights data is loaded only when those UIs need it.

      Signed-off-by: Enrique Mingorance Cano <emingora@redhat.com>
      Co-authored-by: Cursor <cursoragent@cursor.com>

      * test(overview): cover PolicyReport getResource/listResources hooks

      Update StatusSummaryCount and OverviewPage tests to nock one-shot
      fetches, and add unit tests for policy-report helpers and React Query hooks.

      Signed-off-by: Enrique Mingorance Cano <emingora@redhat.com>
      Co-authored-by: Cursor <cursoragent@cursor.com>

      * fix(overview): show loading/error on Cluster recommendations card

      Pass PolicyReport list isLoading/isError into SummaryCard so pending or
      failed fetches do not display misleading zero issue counts.

      Signed-off-by: Enrique Mingorance Cano <emingora@redhat.com>
      Co-authored-by: Cursor <cursoragent@cursor.com>

      * fix(clusters): show unknown state while PolicyReport loads

      Do not treat an in-flight or failed PolicyReport fetch as zero issues
      in StatusSummaryCount; keep a neutral title and skip opening the sidebar.

      Signed-off-by: Enrique Mingorance Cano <emingora@redhat.com>
      Co-authored-by: Cursor <cursoragent@cursor.com>

      * SummaryCard summaryTotalHeader.num loading

      Signed-off-by: Enrique Mingorance Cano <emingora@redhat.com>

      * missing translation

      Signed-off-by: Enrique Mingorance Cano <emingora@redhat.com>

      * fix(overview): add screenreader text to SummaryCard loading skeletons

      Announce localized loading state for the total count and summary text
      Skeletons so assistive tech is not left without a progress label.

      Signed-off-by: Enrique Mingorance Cano <emingora@redhat.com>
      Co-authored-by: Cursor <cursoragent@cursor.com>

      ---------

      Signed-off-by: Enrique Mingorance Cano <emingora@redhat.com>
      Co-authored-by: Cursor <cursoragent@cursor.com>
