      * ACM-42591: Remove unused system crypto-policy and upgrade to PQC base images (#76)

      Pure-Go binaries do not consume /etc/crypto-policies; Go uses native cryptography.
      The crypto-policy stage and COPY were no-ops for the Go backend.

      Fixes CodeRabbit security finding: TLS crypto policy mismatch between system
      config and Go's native TLS setup. Go backend enforces TLS 1.2+ natively.

      Addresses ACM-45722 requirement: Upgrade runtime base images to PQC-enabled
      versions (ubi9-minimal-pqc) to support Post-Quantum Cryptography infrastructure
      for ACM 5.0 and MCE 5.0 releases.

      Changes:
      - Remove unused crypto-policy stage (doesn't affect Go)
      - Upgrade RUNTIME_BASE to ubi9-minimal-pqc:latest
      - Simplifies build while enabling PQC compliance

