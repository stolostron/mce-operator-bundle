    pac.test.appstudio.openshift.io/sha-title: |-
      build(deps): Bump google.golang.org/grpc from 1.79.3 to 1.82.1 in /v2 (#438)

      * build(deps): Bump google.golang.org/grpc from 1.79.3 to 1.82.1 in /v2

      Bumps [google.golang.org/grpc](https://github.com/grpc/grpc-go) from 1.79.3 to 1.82.1.
      - [Release notes](https://github.com/grpc/grpc-go/releases)
      - [Commits](https://github.com/grpc/grpc-go/compare/v1.79.3...v1.82.1)

      ---
      updated-dependencies:
      - dependency-name: google.golang.org/grpc
        dependency-version: 1.82.1
        dependency-type: indirect
      ...

      Signed-off-by: dependabot[bot] <support@github.com>

      * fix: run go mod tidy in asoctl after grpc bump

      The grpc v1.82.1 upgrade in v2/go.mod requires newer transitive deps
      (genproto, protobuf, oauth2) that asoctl/go.mod did not reflect,
      causing the asoctl:build-linux-amd64 step to fail with "go mod tidy
      needed".

      Co-Authored-By: Claude Sonnet 4.6 (1M context) <noreply@anthropic.com>

