    pac.test.appstudio.openshift.io/sha-title: |-
      [release-5.0] ACM-44850: fix(governance): add legacy VAPB naming fallback for Gatekeeper < 3.23.0 (#6905)

      * fix(governance): add legacy VAPB naming fallback for Gatekeeper < 3.23.0

      Gatekeeper changed its ValidatingAdmissionPolicyBinding (VAPB) naming convention
      between versions. Constraints on Gatekeeper < 3.23.0 generate VAPBs named
      `gatekeeper-<constraintname>`, while newer versions use `gatekeeper-<kind>-<constraintname>`.

      The console was only searching for the new format, causing the VAPB field to show
      "-" (not found) on older Gatekeeper versions, even though the VAPB existed.

      This fix adds the legacy naming format as a fallback, matching the pattern already
      used for Kyverno policies (see ACM-35631). The search is safe because:
      1. Each Constraint generates only ONE VAPB
      2. The search limits results to 1 item
      3. Only the first result is used

      Fixes ACM-44850.

      Signed-off-by: Randy Bruno Piverger <21374229+Randy424@users.noreply.github.com>
      Co-Authored-By: Claude Haiku 4.5 <noreply@anthropic.com>

      * fix(test): correct Gatekeeper VAPB test fixtures and assertions

      - Fix gkScope resource to use correct kind format: k8srequiredlabels.v1beta1.constraints.gatekeeper.sh (was using generic constraint.v1beta1)
      - Update hook coverage test to expect both new and legacy VAPB naming conventions for Gatekeeper constraints

      These changes align the tests with the legacy VAPB naming fallback added in the hook to support Gatekeeper < 3.23.0.

      Signed-off-by: Randy Bruno Piverger <21374229+Randy424@users.noreply.github.com>
      Co-Authored-By: Claude Haiku 4.5 <noreply@anthropic.com>

      * test(governance): migrate policy detail state setup

      Signed-off-by: Randy Bruno Piverger <21374229+Randy424@users.noreply.github.com>

      * test(governance): restore recoil state setup

      Signed-off-by: Randy Bruno Piverger <21374229+Randy424@users.noreply.github.com>

