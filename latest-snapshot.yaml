    pac.test.appstudio.openshift.io/sha-title: |-
      Fix broken controller-tools version on backplane-2.10 (#2325)

      - Makefile: CONTROLLER_TOOLS_VERSION v0.15.0 -> v0.19.0. v0.15.0
        depends on golang.org/x/tools v0.20.0, which fails to compile on
        Go 1.25.11+/1.26.x (confirmed locally: 'invalid array length
        -delta * delta' in golang.org/x/tools/internal/tokeninternal).
        This branch's go.mod/Dockerfiles are already on Go 1.26.3, so
        'make controller-gen' (and any CI job invoking it) was already
        broken on this branch.

      Regenerated code via controller-gen v0.19.0:
      - api/v1/zz_generated.deepcopy.go: DeepCopyInto for Filter was
        missing deep-copy logic for the ClusterTypes, InfrastructureProviders,
        and Regions slice fields (previously shallow-copied, sharing the
        underlying array with the source). controller-gen v0.19.0 correctly
        generates deep-copy logic for all four slice fields on Filter.
      - CRDs: controller-gen v0.19.0 wanted to add a
        'required: [status, type]' block to the DiscoveredCluster condition
        schema; manually reverted to keep this change scoped to the
        toolchain fix. No RBAC changes on this branch.

      Signed-off-by: dislbenn <dbennett@redhat.com>
