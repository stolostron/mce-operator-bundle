    pac.test.appstudio.openshift.io/sha-title: |-
      ACM-41784: Fix install-aap.sh to actually disable Automation Hub (#6732)

      Omitting the hub: key from the AnsibleAutomationPlatform spec does not
      disable Hub on the current AAP operator bundle -- the operator's
      ansibleautomationplatform role enables Hub whenever the key is absent
      at all. This caused every cluster provisioned with ENABLE_HUB=false to
      silently get Hub deployed anyway, whose ReadWriteMany file-storage PVC
      is incompatible with EBS-backed storage classes and gets stuck Pending
      indefinitely along with 5-6 Hub pods.

      Emit hub: {disabled: true} instead of omitting the key, which is the
      only way the operator's role actually honors as "do not provision
      Hub." Verified end-to-end on a clean cluster.

      Signed-off-by: Randy Bruno Piverger <21374229+Randy424@users.noreply.github.com>
      Co-authored-by: Randy Bruno Piverger <21374229+Randy424@users.noreply.github.com>
      Co-authored-by: Claude Sonnet 5 <noreply@anthropic.com>
