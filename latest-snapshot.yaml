      calls (navigation after create/edit); prefix them with the `void` operator to make the intent
      explicit, matching existing usage in the codebase. No behavior change.

      Signed-off-by: Kevin Cormier <kcormier@redhat.com>
      Co-Authored-By: Claude Opus 4.8 <noreply@anthropic.com>

      * ACM-23889 Mark floating promises as ignored in Home overview

      Sonar typescript:S9383 flags promise-returning calls used as statements
      without being awaited or handled. These are intentional fire-and-forget
      calls (upgrade-risk and user-preference fetches); prefix them with the `void` operator to make the intent
      explicit, matching existing usage in the codebase. No behavior change.

      Signed-off-by: Kevin Cormier <kcormier@redhat.com>
      Co-Authored-By: Claude Opus 4.8 <noreply@anthropic.com>

      * ACM-23889 Mark floating promises as ignored in core lib, hooks, and navigation

      Sonar typescript:S9383 flags promise-returning calls used as statements
      without being awaited or handled. These are intentional fire-and-forget
      calls (navigation, resource deletes, and data fetches); prefix them with
      the `void` operator to make the intent explicit, matching existing usage
      in the codebase. No behavior change.

      Signed-off-by: Kevin Cormier <kcormier@redhat.com>
      Co-Authored-By: Claude Opus 4.8 <noreply@anthropic.com>

      * ACM-23889 Mark floating promises as ignored in shared components

      Sonar typescript:S9383 flags promise-returning calls used as statements
      without being awaited or handled. These are intentional fire-and-forget
      calls (navigation, clipboard, and data loading); prefix them with the
      `void` operator to make the intent explicit, matching existing usage in
      the codebase. No behavior change.

      Signed-off-by: Kevin Cormier <kcormier@redhat.com>
      Co-Authored-By: Claude Opus 4.8 <noreply@anthropic.com>

      * ACM-23889 Surface sync failures in SyncResourceModal

      reconcileResources only handled the success case, so a rejected
      reconciliation was silently discarded and the user was never told the
      sync failed. Add a .catch handler that logs the error and shows a danger
      toast, matching the error-handling pattern in SyncArgoCDModal. The chain
      now ends with .catch, so the promise is properly handled.

      Signed-off-by: Kevin Cormier <kcormier@redhat.com>
      Co-Authored-By: Claude Opus 4.8 <noreply@anthropic.com>

      * ACM-23889 Return submit promises so form errors surface

      AnsibleAutomationsForm and InstallSubmarinerForm were voiding the
      resource-mutation promise inside their AcmDataFormPage `submit` handlers.
      AcmDataForm relies on the returned promise to display submit errors and
      drive the submitting/loading state, so voiding it meant a failed create
      or replace (or a thrown aggregate error from settled results) was
      silently swallowed with no feedback. Return the promise instead of using
      `void`; this both restores error handling and satisfies the floating-
      promise rule (the promise is no longer discarded).

      Signed-off-by: Kevin Cormier <kcormier@redhat.com>
      Co-Authored-By: Claude Opus 4.8 <noreply@anthropic.com>

      * ACM-23889 Test success and failure toasts in SyncResourceModal

      Cover the reconcileResources success path (success toast) and the newly
      added rejection path (danger toast) in SyncResourceModal.

      Signed-off-by: Kevin Cormier <kcormier@redhat.com>
      Co-Authored-By: Claude Opus 4.8 <noreply@anthropic.com>

      * ACM-23889 Remove file-level coverage ignore from NavigationPath

      The back/cancel navigation helpers in this file now have unit tests, so
      the blanket `istanbul ignore file` directive is no longer appropriate and
      was preventing that covered code from being measured.

      Signed-off-by: Kevin Cormier <kcormier@redhat.com>
      Co-Authored-By: Claude Opus 4.8 <noreply@anthropic.com>

      * ACM-23889 Add tests covering navigation in reliability cleanup

      Cover the navigation/clipboard/form-submit code paths touched by this
      PR's floating-promise cleanup so the changed lines are exercised:
      Applications (Overview, ApplicationDetails, AdvancedConfiguration),
      Governance (EditPolicy, EditPolicySet), Search (DetailsOverviewPage),
      Infrastructure (AnsibleAutomations, AnsibleAutomationsForm,
      InfraEnvironmentsPage), Credentials, AcmDataForm, and a new
      NavigationPath back/cancel hook test. Tests assert the resulting
      navigation/behavior, not just rendering.

      Signed-off-by: Kevin Cormier <kcormier@redhat.com>
      Co-Authored-By: Claude Opus 4.8 <noreply@anthropic.com>

      * ACM-23889 Assert exact push-model route in Overview create test

      toHaveTextContent does a substring match, so the argo push-model
      assertion ('/multicloud/applications/create/argo') would also pass for
      the pull-model route ('.../argopullmodel'). Compare the location display's
      full textContent exactly so a regression to the pull-model path is caught.

      Signed-off-by: Kevin Cormier <kcormier@redhat.com>
      Co-Authored-By: Claude Opus 4.8 <noreply@anthropic.com>

      * ACM-23889 Parameterize Overview row-action navigation tests

      The seven 'row action navigates to ...' tests were structurally identical,
      differing only in app name, action, and expected route (Sonar
      typescript:S5976). Consolidate them into a single test.each with a row per
      case, preserving each case's name and assertion.

      Signed-off-by: Kevin Cormier <kcormier@redhat.com>
      Co-Authored-By: Claude Opus 4.8 <noreply@anthropic.com>

      ---------

      Signed-off-by: Kevin Cormier <kcormier@redhat.com>
      Co-authored-by: Claude Opus 4.8 <noreply@anthropic.com>
