      Add OPERATOR_VERSION and OPERATOR_PACKAGE env vars to CSV (#3823)

      The operator panics at startup with "OPERATOR_VERSION not defined"
      because these required env vars are missing from the CSV deployment
      spec. Add them with the current version (2.11.4) which will be
      updated to the build version by art.yaml during bundle generation.

