    pac.test.appstudio.openshift.io/sha-title: |-
      Disable Renovate updates for peerDependencies (#6550)

      Peer dependencies express compatibility ranges, not pinned versions.
      Renovate's rangeStrategy: bump narrows these ranges (e.g. >=18 to
      >=18.3.1), which makes packages less flexible without any functional
      benefit since the lockfile already resolves to the latest compatible
      version.

      This avoids unnecessary PRs like #6546 (react) and #6547 (react-dom)
      that only tighten peer dependency ranges.

      Signed-off-by: Kevin Cormier <kcormier@redhat.com>
