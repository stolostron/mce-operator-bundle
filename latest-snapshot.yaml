    pac.test.appstudio.openshift.io/sha-title: |-
      [ACM-48161] Go backend - include it as a part of the sonar report - Solve sonar issues (#6961)

      * ACM-48161 Enable Go backend coverage hooks for unit tests

      Expose small seams (SA namespace path, clusterrole handlers, tunable
      SSAR cache size) so packages that were near 0% can be exercised without
      a full DI rewrite.

      Signed-off-by: Enrique Mingorance Cano <emingora@redhat.com>
      Co-authored-by: Cursor <cursoragent@cursor.com>

      * ACM-48161 Raise Go backend unit coverage to at least 80%

      Add and extend package tests so every backend source file meets the
      80% statement coverage floor (overall ~87%), including cmd/console,
      clusterinfo, and rosa.

      Signed-off-by: Enrique Mingorance Cano <emingora@redhat.com>
      Co-authored-by: Cursor <cursoragent@cursor.com>

      * rosa.go code duplication

      Signed-off-by: Enrique Mingorance Cano <emingora@redhat.com>

      * remove code duplication

      Signed-off-by: Enrique Mingorance Cano <emingora@redhat.com>

      * ines longer than 120 chars in proxy_test.go issue solved

      Signed-off-by: Enrique Mingorance Cano <emingora@redhat.com>

      * coderabbit suggestions

      Signed-off-by: Enrique Mingorance Cano <emingora@redhat.com>

      * sonar issues solved

      Signed-off-by: Enrique Mingorance Cano <emingora@redhat.com>

      * Removed the useless time.Sleep after cancel in TestStartCleanupExitsOnCancel from rbac_test.go

      Signed-off-by: Enrique Mingorance Cano <emingora@redhat.com>

      * TestStartCleanupExitsOnCancel coderabbit suggestion

      Signed-off-by: Enrique Mingorance Cano <emingora@redhat.com>

      * Introduce shared httpx media constants and adopt them across backend

      Add backend/internal/httpx/media.go with constants for Content-Type, Accept,
      and application/json, then replace the hard-coded header names and media
      types throughout the Go backend handlers.

      Signed-off-by: Enrique Mingorance Cano <emingora@redhat.com>

      * Adopt httpx media constants in backend tests

      Replace hard-coded "Content-Type", "Accept", and "application/json" strings
      with the shared httpx.HeaderContentType, HeaderAccept, and MIMEJSON
      constants across backend test files.

      Signed-off-by: Enrique Mingorance Cano <emingora@redhat.com>

      * Refactor SSAR cache cleanup helpers into ssarcache package

      Introduce StartIf, ExpireIf, and Sweep helpers in backend/internal/ssarcache
      to consolidate cleanup logic shared by the RBAC, aggregate, and events/hub
      SSAR caches. Replace duplicated expiry, eviction, and nil-guard boilerplate
      in the three callers with the new helpers, and add unit tests for the new
      functions.

      Signed-off-by: Enrique Mingorance Cano <emingora@redhat.com>

      ---------

      Signed-off-by: Enrique Mingorance Cano <emingora@redhat.com>
      Co-authored-by: Cursor <cursoragent@cursor.com>
