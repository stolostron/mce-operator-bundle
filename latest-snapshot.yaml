    pac.test.appstudio.openshift.io/sha-title: |-
      chore(deps): bump go.opentelemetry.io/otel to v1.44.0 on backplane-2.9 (#1365)

      Bumps go.opentelemetry.io/otel and go.opentelemetry.io/otel/trace from
      v1.41.0 to v1.44.0 to fix CVE-2026-41178 (OpenTelemetry-Go: Denial of
      Service via oversized baggage headers).

      Vulnerable: v1.41.0, v1.43.0 (raw-length rejection removed from
      baggage header parsing). Fixed: v1.42.0, v1.44.0.

