      calls (navigation and policy template fetches); prefix them with the `void` operator to make the intent
      explicit, matching existing usage in the codebase. No behavior change.

      Signed-off-by: Kevin Cormier <kcormier@redhat.com>
      Co-Authored-By: Claude Opus 4.8 <noreply@anthropic.com>

      * ACM-23889 Mark floating promises as ignored in Credentials routes

      Sonar typescript:S9383 flags promise-returning calls used as statements
