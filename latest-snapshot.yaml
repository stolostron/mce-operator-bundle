    pac.test.appstudio.openshift.io/sha-title: |-
      fix: revert devcontainer to .devcontainer build context and sync from upstream (#427)

      * fix: revert devcontainer to .devcontainer build context and sync from upstream

      Co-Authored-By: Claude Opus 4.6 <noreply@anthropic.com>

      * fix: set devcontainer build context to .devcontainer directory

      Self-review finding addressed before external review.

      The Dockerfile was changed to COPY install-dependencies.sh (without
      path prefix), which assumes the build context is .devcontainer/. The
      devcontainer.json context was still set to ".." (repo root) which
      would cause the COPY to fail with "file not found in build context".
      Setting context to "." makes the build context .devcontainer/ as
      the Dockerfile expects.

      Co-Authored-By: Claude Sonnet 4.6 (1M context) <noreply@anthropic.com>

      * Revert "fix: set devcontainer build context to .devcontainer directory"

      This reverts commit 6527959e80481ad115ee6fdee5288ff73a7a5874.

