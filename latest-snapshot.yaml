    pac.test.appstudio.openshift.io/sha-title: |-
      Add managedcluster-import-controller-v2 deployment status tracking (#3971)

      The managedcluster-import-controller-v2 deployment is rendered as part
      of the server-foundation chart but was not being tracked by the
      StatusManager. This adds status tracking for the deployment in both
      ensureServerFoundation() (enabled) and ensureNoServerFoundation()
      (disabled), following the same pattern used for the other
      server-foundation components (ocm-controller, ocm-proxyserver,
      ocm-webhook).

      Signed-off-by: dislbenn <dbennett@redhat.com>
      Co-authored-by: dislbenn <dbennett@redhat.com>
