    pac.test.appstudio.openshift.io/sha-title: |-
      Close upgrade cleanup gap for cluster-wide curator-crb (#607)

      PR #606 fixed cluster-wide ClusterRoleBinding/curator-crb to bind a
      minimal ClusterRole, and added cleanup of the cluster-installer
      ServiceAccount and namespaced RoleBinding once a curation completes.
      However, upgrade curations never clear DesiredCuration back to "" (see
      utils.NeedToUpgrade), and the predicate blocked events where only
      CuratingJob cleared, so the cleanup path never ran for Hypershift
      upgrades. This left curator-crb granting cluster-wide managedclusters
      access indefinitely after an upgrade completed.

      - Allow the predicate to pass through when CuratingJob clears, not just
        when DesiredCuration clears, so Reconcile runs once an upgrade Job
        finishes.
      - Add an independent, ownership-guarded cleanup of curator-crb in
        Reconcile for Hypershift curators whenever no job is actively
        running, covering the upgrade completion path.
      - Extract the guarded curator-crb deletion from CleanupRBACHypershift
        into an exported CleanupCuratorCRBIfOwned helper shared by both call
        sites.

      The cluster-installer ServiceAccount and namespaced RoleBinding/curator
      still persist after an upgrade completes (DesiredCuration remains
      "upgrade"), matching existing Hive-style residue; this is accepted as
      lower-severity, namespace-bounded risk since it grants no cluster-wide
      authority.

      Signed-off-by: Xiangjing Li <xiangli@redhat.com>
    pac.test.appstudio.openshift.io/sha-url: https://github.com/stolostron/cluster-curator-controller/commit/dc7ba8c5e5e63963e2a4a88b7c92952fa40b8a17
