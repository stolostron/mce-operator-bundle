    pac.test.appstudio.openshift.io/sha-title: |-
      ACM-39124: fix(clusters): guard UpdateAutomationModal alert against undefined nonUpdatableCount (#6604)

      ClustersTable mounts UpdateAutomationModal unconditionally with clusters=undefined
      on page load. The condition nonUpdatableCount !== 0 evaluates to true when
      nonUpdatableCount is undefined, causing t() to be called with count: undefined
      on every re-render. Change the guard to !!nonUpdatableCount so undefined is
      correctly treated as falsy.

      Signed-off-by: Randy Bruno Piverger <21374229+Randy424@users.noreply.github.com>
      Co-authored-by: Randy Bruno Piverger <21374229+Randy424@users.noreply.github.com>
      Co-authored-by: Claude Sonnet 4.6 (1M context) <noreply@anthropic.com>
